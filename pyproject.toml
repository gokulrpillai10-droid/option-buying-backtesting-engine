[project]
name = "nifty-strategy-engine"
version = "0.1.0"
description = "Accurate intraday NIFTY option-buying backtest engine"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
equity-fetch = ["kiteconnect>=5", "python-dotenv>=1"]   # live Kite fetch only; backtest/tests don't need them

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["engine*"]
